<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Bannery Stopki</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
      color: #1f2937;
    }

    .logo {
      width: 140px;
      margin-bottom: 28px;
    }

    /* PIN screen */
    #pinScreen {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
      width: 100%;
      max-width: 360px;
    }
    #pinScreen h1 { font-size: 1.3rem; margin-bottom: 8px; }
    #pinScreen p { color: #6b7280; font-size: 0.9rem; margin-bottom: 24px; }
    #pinInput {
      width: 100%;
      padding: 12px 16px;
      font-size: 1.2rem;
      text-align: center;
      letter-spacing: 0.3em;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    #pinInput:focus { border-color: #6366f1; }
    #pinError { color: #ef4444; font-size: 0.85rem; margin-top: 10px; min-height: 20px; }
    .btn-primary {
      margin-top: 16px;
      width: 100%;
      padding: 12px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }

    /* Admin panel */
    #adminPanel {
      display: none;
      width: 100%;
      max-width: 760px;
    }
    #adminPanel h1 {
      font-size: 1.4rem;
      margin-bottom: 6px;
    }
    #adminPanel .subtitle {
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .banner-card {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      margin-bottom: 24px;
    }
    .banner-card h2 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .banner-card .desc {
      font-size: 0.82rem;
      color: #6b7280;
      margin-bottom: 20px;
    }

    .banner-preview-wrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .current-preview img {
      max-width: 100%;
      max-height: 100px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      display: block;
    }
    .current-preview .label {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 6px;
    }
    .current-link {
      font-size: 0.82rem;
      color: #6b7280;
      word-break: break-all;
      margin-top: 6px;
      padding: 6px 10px;
      background: #f9fafb;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
    }
    .current-link span { color: #374151; font-weight: 500; }

    .banner-form { width: 100%; }

    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 5px;
    }
    .field input[type="text"],
    .field input[type="url"] {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus { border-color: #6366f1; }

    .file-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .file-label {
      display: inline-block;
      padding: 8px 14px;
      background: #f3f4f6;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .file-label:hover { background: #e5e7eb; }
    .file-name {
      font-size: 0.82rem;
      color: #6b7280;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 180px;
    }
    input[type="file"] { display: none; }

    .new-preview-wrap { margin-top: 10px; display: none; }
    .new-preview-wrap img {
      max-width: 260px;
      max-height: 90px;
      border-radius: 8px;
      border: 1px solid #6366f1;
    }
    .new-preview-wrap .label {
      font-size: 0.75rem;
      color: #6366f1;
      margin-top: 4px;
    }

    .save-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
    }
    .btn-save {
      padding: 10px 24px;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
      font-weight: 600;
    }
    .btn-save:hover { background: #059669; }
    .btn-save:disabled { background: #6ee7b7; cursor: not-allowed; }

    .btn-save.dirty {
      animation: pulseGlow 1.5s ease-in-out infinite;
      background: #f59e0b;
    }
    .btn-save.dirty:hover { background: #d97706; }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.6); transform: scale(1); }
      50% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); transform: scale(1.04); }
    }
    .dirty-hint {
      font-size: 0.82rem;
      color: #d97706;
      font-weight: 600;
      margin-left: 4px;
    }

    .status-msg {
      font-size: 0.85rem;
      min-height: 20px;
    }
    .status-msg.ok { color: #10b981; }
    .status-msg.err { color: #ef4444; }
    .status-msg.loading { color: #6366f1; }

    /* Zakładki marek */
    .brand-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .brand-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border: 2px solid #e5e7eb;
      background: #fff;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      color: #6b7280;
      font-family: inherit;
      transition: all 0.15s;
    }
    .brand-tab img { width: 22px; height: 22px; object-fit: contain; }
    .brand-tab:hover { background: #f9fafb; }
    .brand-tab.active { color: #111827; }
    .banner-card .missing {
      margin: 0 0 12px;
      padding: 8px 12px;
      background: #fef3c7;
      border: 1px solid #fcd34d;
      border-radius: 8px;
      color: #92400e;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<img class="logo" src="https://raw.githubusercontent.com/adminzohomedidesk/Stopka_email/main/20251001 MD fav.png" alt="Medidesk" />

<!-- PIN -->
<div id="pinScreen">
  <h1>Panel administracyjny</h1>
  <p>Wprowadź PIN aby zarządzać bannerami stopki email.</p>
  <input id="pinInput" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off" />
  <div id="pinError"></div>
  <button class="btn-primary" id="pinBtn">Wejdź</button>
</div>

<!-- Admin -->
<div id="adminPanel">
  <h1>Zarządzanie bannerami</h1>
  <p class="subtitle">Zmiany są od razu widoczne w generatorze stopek po odświeżeniu strony.</p>

  <div class="brand-tabs" id="brandTabs"></div>
  <div id="bannerCards"></div>
</div>

<script>
  const API_URL = "https://stopka-api.onrender.com";
  const RAW_BASE = "https://raw.githubusercontent.com/adminzohomedidesk/Stopka_email/main";
  let userPin = "";  // PIN walidowany serwerowo

  // === Marki i ich pliki ===
  // Odpowiednik tabeli BRANDS w proxy i w generatorze. Dodanie marki = jeden wpis.
  const BRANDS = {
    medidesk: {
      label: "Medidesk",
      logo: `${RAW_BASE}/20251001%20MD%20fav.png`,
      accent: "#00bfa5",
      akcjaPng: "banner_akcja_1.png",
      akcjaHtml: "banner_akcja.html",
      emailPng: "banner_email_1.png",
    },
    vetidesk: {
      label: "Vetidesk",
      logo: `${RAW_BASE}/vetidesk_fav.png`,
      accent: "#0A7DF6",
      akcjaPng: "banner_vet_akcja_1.png",
      akcjaHtml: "banner_vet_akcja.html",
      emailPng: "banner_vet_email_1.png",
    },
  };

  let activeBrand = "medidesk";
  let config = {};             // odpowiedź /api/config
  let brandsSupported = false; // czy serwer zna już podział na marki

  // PIN
  const pinInput = document.getElementById("pinInput");
  const pinBtn = document.getElementById("pinBtn");
  const pinError = document.getElementById("pinError");

  const checkPin = () => {
    // PIN walidowany serwerowo przy zapisie
    if (!pinInput.value) {
      pinError.textContent = "Wprowadź PIN.";
      return;
    }
    userPin = pinInput.value;
    document.getElementById("pinScreen").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
    renderTabs();
    loadConfig();
  };
  pinBtn.addEventListener("click", checkPin);
  pinInput.addEventListener("keydown", e => { if (e.key === "Enter") checkPin(); });

  // === Zakładki marek ===
  const renderTabs = () => {
    const tabs = document.getElementById("brandTabs");
    tabs.innerHTML = "";
    Object.entries(BRANDS).forEach(([key, b]) => {
      const btn = document.createElement("button");
      btn.className = "brand-tab" + (key === activeBrand ? " active" : "");
      btn.style.borderColor = key === activeBrand ? b.accent : "#e5e7eb";
      btn.innerHTML = `<img src="${b.logo}" alt="${b.label}"><span>${b.label}</span>`;
      btn.addEventListener("click", () => {
        activeBrand = key;
        renderTabs();
        renderCards();
      });
      tabs.appendChild(btn);
    });
  };

  // === Karty bannerów dla aktywnej marki ===
  // Oba sloty ("akcja" i "email") mają ten sam układ, różnią się etykietami
  // i tym, co zapisują — więc budujemy je z jednego szablonu.
  const SLOTS = [
    {
      id: "akcja",
      title: "Banner akcji / wydarzenia",
      linkLabel: "Nowy adres docelowy wydarzenia",
      currentLabel: "Przekierowuje do:",
      endpoint: "/api/admin/banner-akcja",
      payloadKey: "redirect_url",
      emptyMsg: "Podaj adres docelowy wydarzenia.",
      file: (b) => b.akcjaPng,
      desc: (b) => `Plik: <code>${b.akcjaPng}</code> — kliknięcie zawsze idzie przez <code>${b.akcjaHtml}</code>, który przekierowuje do aktualnego wydarzenia`,
      value: (cfg) => cfg.redirect_akcja || "",
    },
    {
      id: "email",
      title: "Banner standardowy",
      linkLabel: "Nowy link po kliknięciu w banner",
      currentLabel: "Aktualny link:",
      endpoint: "/api/admin/banner-email",
      payloadKey: "link",
      emptyMsg: "Podaj link dla bannera.",
      file: (b) => b.emailPng,
      desc: (b) => `Plik: <code>${b.emailPng}</code> — drugi banner w generatorze`,
      value: (cfg) => cfg.link_email || "",
    },
  ];

  const renderCards = () => {
    const brand = BRANDS[activeBrand];
    const brandCfg = (config.brands && config.brands[activeBrand]) || {};
    const wrap = document.getElementById("bannerCards");
    wrap.innerHTML = "";

    SLOTS.forEach((slot) => {
      const fileName = slot.file(brand);
      const imgUrl = `${RAW_BASE}/${fileName}`;
      const currentValue = slot.value(brandCfg);

      const card = document.createElement("div");
      card.className = "banner-card";
      card.innerHTML = `
        <h2>${slot.title}</h2>
        <p class="desc">${slot.desc(brand)}</p>
        <div class="missing" data-role="missing" style="display:none;">
          Tego bannera nie ma jeszcze w repozytorium — dopóki nie wgrasz pliku, nie pojawi się w generatorze.
        </div>
        <div class="banner-preview-wrap">
          <div class="current-preview">
            <img data-role="preview" src="${imgUrl}?t=${Date.now()}" data-base="${imgUrl}" alt="${slot.title}" />
            <div class="label">Aktualny banner</div>
            <div class="current-link">${slot.currentLabel} <span data-role="current">${currentValue || "—"}</span></div>
          </div>
          <div class="banner-form">
            <div class="field">
              <label>${slot.linkLabel}</label>
              <input type="url" data-role="link" placeholder="https://..." value="${currentValue.replace(/"/g, "&quot;")}" />
            </div>
            <div class="field">
              <label>Nowy plik graficzny (opcjonalnie)</label>
              <div class="file-row">
                <label class="file-label" for="file_${activeBrand}_${slot.id}">Wybierz plik</label>
                <span class="file-name" data-role="fileName">nie wybrano</span>
                <input type="file" id="file_${activeBrand}_${slot.id}" data-role="file" accept="image/png,image/jpeg,image/gif" />
              </div>
              <div class="new-preview-wrap" data-role="newPreviewWrap">
                <img data-role="newPreview" src="" alt="Nowy banner" />
                <div class="label">Nowy banner (podgląd)</div>
              </div>
            </div>
            <div class="save-row">
              <button class="btn-save" data-role="save">Zapisz zmiany</button>
              <span class="status-msg" data-role="status"></span>
            </div>
          </div>
        </div>`;

      wrap.appendChild(card);
      wireCard(card, slot, currentValue);

      // Zabezpieczenie na czas, gdy front jest już nowy, a serwer jeszcze stary.
      if (activeBrand !== "medidesk" && !brandsSupported) {
        const saveBtn = card.querySelector('[data-role="save"]');
        const statusEl = card.querySelector('[data-role="status"]');
        saveBtn.disabled = true;
        statusEl.className = "status-msg err";
        statusEl.textContent = "Serwer nie obsługuje jeszcze marki Vetidesk — zapis zablokowany.";
      }
    });
  };

  const wireCard = (card, slot, savedValue) => {
    const q = (role) => card.querySelector(`[data-role="${role}"]`);
    const previewImg = q("preview");
    const linkInput = q("link");
    const fileInput = q("file");
    const saveBtn = q("save");
    const statusEl = q("status");
    let saved = savedValue;

    // Brakujący plik (np. akcja Vetidesku, której jeszcze nie ma) — pokaż komunikat
    previewImg.addEventListener("error", () => {
      previewImg.style.display = "none";
      q("missing").style.display = "block";
    });

    const markDirty = () => {
      saveBtn.classList.add("dirty");
      if (!card.querySelector(".dirty-hint")) {
        const hint = document.createElement("span");
        hint.className = "dirty-hint";
        hint.textContent = "← niezapisane zmiany";
        saveBtn.parentElement.appendChild(hint);
      }
    };
    const clearDirty = () => {
      saveBtn.classList.remove("dirty");
      const hint = card.querySelector(".dirty-hint");
      if (hint) hint.remove();
    };

    linkInput.addEventListener("input", () => {
      if (linkInput.value !== saved) markDirty(); else clearDirty();
    });

    fileInput.addEventListener("change", function () {
      const file = this.files[0];
      if (!file) return;
      q("fileName").textContent = file.name;
      const reader = new FileReader();
      reader.onload = e => {
        q("newPreview").src = e.target.result;
        q("newPreviewWrap").style.display = "block";
      };
      reader.readAsDataURL(file);
      markDirty();
    });

    saveBtn.addEventListener("click", async () => {
      const value = linkInput.value.trim();
      if (!value) {
        statusEl.className = "status-msg err";
        statusEl.textContent = slot.emptyMsg;
        return;
      }

      statusEl.className = "status-msg loading";
      statusEl.textContent = "Zapisuję... (jeśli serwer spał, może potrwać ~30s)";
      saveBtn.disabled = true;

      try {
        const payload = { pin: userPin, brand: activeBrand };
        payload[slot.payloadKey] = value;
        if (fileInput.files[0]) payload.image_base64 = await fileToBase64(fileInput.files[0]);

        const r = await fetch(`${API_URL}${slot.endpoint}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (r.status === 401) throw new Error("Nieprawidłowy PIN — odśwież stronę i wpisz poprawny.");
        if (!r.ok) throw new Error("Błąd serwera (" + r.status + ")");

        q("current").textContent = value;
        if (fileInput.files[0]) {
          // Pokaż natychmiast uploadowany plik (z pamięci przeglądarki) — bez czekania na CDN
          previewImg.src = await fileToDataUrl(fileInput.files[0]);
          previewImg.style.display = "";
          q("missing").style.display = "none";
          fileInput.value = "";
          q("fileName").textContent = "nie wybrano";
          q("newPreviewWrap").style.display = "none";
        }

        saved = value;
        clearDirty();
        statusEl.className = "status-msg ok";
        statusEl.textContent = "✓ Zapisano! Podgląd zaktualizuje się za chwilę.";
      } catch (err) {
        statusEl.className = "status-msg err";
        statusEl.textContent = "Błąd: " + err.message;
      } finally {
        saveBtn.disabled = false;
      }
    });
  };

  const loadConfig = async () => {
    try {
      const r = await fetch(`${API_URL}/api/config?t=${Date.now()}`);
      if (!r.ok) throw new Error("Serwer nie odpowiada");
      config = await r.json();
      // Starsze proxy nie zna marek. Ignoruje wtedy pole "brand" i zapisałoby
      // banner Vetidesku POD PLIKAMI MEDIDESKU — dlatego przy takim proxy
      // blokujemy zapis dla marek innych niż Medidesk (patrz renderCards).
      brandsSupported = !!config.brands;
      if (!config.brands) {
        config.brands = { medidesk: { redirect_akcja: config.redirect_akcja, link_email: config.link_email } };
      }
    } catch (e) {
      console.warn("Nie udało się wczytać konfiguracji", e);
      config = { brands: {} };
      brandsSupported = false;
    }
    renderCards();
  };

  const fileToBase64 = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });

  // Pełny data URL (do natychmiastowego pokazania uploadowanego obrazka bez czekania na CDN)
  const fileToDataUrl = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
</script>
</body>
</html>
